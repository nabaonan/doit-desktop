# 打 v* tag 时：各平台独立 job 构建 → 上传产物 → 最后 release job 汇总发布 GitHub Release。
# Actions 页面可清晰看到完整流程（macOS×2 / Windows / Linux 并行 → 汇总发布）。
# 结构参考：doit-gpui 的 release（每平台一个 job + 产物传递 + 发布 job）。
# 手动触发（workflow_dispatch）：只构建并上传产物，不创建 Release（避免误发）。
name: Release CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    # 单 job 顺序构建 arm64 + x64 两个 target（不再并行抢占 macos runner）。
    # 背景：此前用 matrix 两个 job 并行跑在 macos-15，免费账号 macOS runner 队列紧张时，
    # x64 分支经常排队 ~20 分钟被系统取消，导致 needs 全绿失败、release 发布被跳过。
    # 合并为一个 job 后只需 1 个 macOS runner，排队概率减半，且总时长相近。
    name: macOS DMG（arm64 + x64 交叉编译）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 签名为可选：配了 TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD 才生成签名 updater 产物；
      # 注意 secrets 不能用在 step 的 if 条件，先经 env 读取再判定。
      - name: 无签名密钥时关闭 updater 签名产物
        env:
          TPK: ${{ secrets.TAURI_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$TPK" ]; then
            echo "已配置 TAURI_PRIVATE_KEY，保留 updater 签名产物"
          else
            echo "未配置 TAURI_PRIVATE_KEY，临时关闭 createUpdaterArtifacts"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));delete (d.bundle||{}).createUpdaterArtifacts;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');"
          fi

      - name: 构建 Tauri（arm64）
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: 构建 Tauri（x64 交叉编译）
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/latest.json
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.sig
          if-no-files-found: warn

  windows:
    name: Windows x64（NSIS）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 无签名密钥时关闭 updater 签名产物
        env:
          TPK: ${{ secrets.TAURI_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$TPK" ]; then
            echo "已配置 TAURI_PRIVATE_KEY，保留 updater 签名产物"
          else
            echo "未配置 TAURI_PRIVATE_KEY，临时关闭 createUpdaterArtifacts"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));delete (d.bundle||{}).createUpdaterArtifacts;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');"
          fi

      - name: 构建 Tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/latest.json
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
          if-no-files-found: warn

  linux:
    name: Linux x64（.deb）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 无签名密钥时关闭 updater 签名产物
        env:
          TPK: ${{ secrets.TAURI_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$TPK" ]; then
            echo "已配置 TAURI_PRIVATE_KEY，保留 updater 签名产物"
          else
            echo "未配置 TAURI_PRIVATE_KEY，临时关闭 createUpdaterArtifacts"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));delete (d.bundle||{}).createUpdaterArtifacts;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');"
          fi

      - name: 构建 Tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/**/latest.json
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

  release:
    name: 汇总并发布 GitHub Release
    needs: [macos, windows, linux]
    # 只有 tag 触发才发布；workflow_dispatch 走到这里会被跳过（只保留上面构建的产物）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出（取 tag 与仓库元信息）
        uses: actions/checkout@v4

      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成发布说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-body.md <<MD

          ## doit-desktop ${VERSION}

          **支持的平台**
          - macOS：Apple Silicon（.dmg）+ Intel（.dmg）
          - Windows：x64（NSIS 安装包 .exe）
          - Linux：x64（.deb）

          由 GitHub Actions 自动构建发布（参考 doit-gpui 的多 job 流水线）。
          MD

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/**
